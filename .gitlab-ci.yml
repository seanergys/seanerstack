# SPDX-License-Identifier: Apache-2.0
image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

stages:
  - test
  - build
  - docs
  - publish
  - toolchain

# A merge request runs merge request pipelines, which become merged results
# and merge train pipelines once the project enables them. A branch with an
# open merge request runs no second pipeline for the same push. Other branches,
# the default branch and tags run branch and tag pipelines.
# docs/explanation/pipelines.md lists which job runs where.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

test:
  stage: test
  # Everywhere but in schedules, which are for the slow jobs.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  script:
    - uv sync --group dev
    - uv run pytest
    - uv run seanerstack validate

# The end-to-end tests: each job builds the wheel of this commit, installs it
# into a fresh environment, and runs one file of tests/e2e against this GitLab
# instance, with the job token. They run in merge requests, so that what
# reaches the default branch has passed them in the merge train, and in the
# nightly schedule, which notices when Spack or this GitLab instance changes
# under an unchanged default branch.
.e2e:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(schedule|web)$/'
  variables:
    SEANERSTACK_E2E_REQUIRED: "1"
    SEANERSTACK_E2E_USERNAME: "gitlab-ci-token"
    SEANERSTACK_E2E_TOKEN: "$CI_JOB_TOKEN"
    SEANERSTACK_E2E_REGISTRY: "oci://$CI_REGISTRY_IMAGE"
  before_script:
    - apt-get update
    # Git for Spack and the tests; a compiler, make and archivers for Spack to
    # build the test package. Seanerstack installs the pinned Spack itself.
    - >-
      apt-get install -y --no-install-recommends
      bzip2 ca-certificates file g++ gcc git libc6-dev make patch unzip xz-utils

# The installed wheel, the secrets file and --version.
e2e:install:
  extends: .e2e
  script:
    - tests/e2e/run.sh tests/e2e/test_install.py

# Git access with the credentials of a secrets file: valid, invalid, and
# behind a wrong vault password.
e2e:credentials:
  extends: .e2e
  script:
    - tests/e2e/run.sh tests/e2e/test_credentials.py

# What init sets up and checks, and the state's spack without activation.
# These only read the registry.
e2e:init:
  extends: .e2e
  script:
    - tests/e2e/run.sh tests/e2e/test_init.py

# Builds a small package, pushes it into test-e2e-buildcache-<test> in the
# project's container registry, separate from the project build cache, and
# installs it back from there.
e2e:buildcache:
  extends: .e2e
  # That repository is named after the test, not the pipeline, so two of these
  # jobs at once, as in the pipelines of a merge train, would overwrite each
  # other's index. They take turns instead.
  resource_group: e2e-registry
  script:
    - tests/e2e/run.sh tests/e2e/test_buildcache.py

# In an image whose distribution packages a GCC, init finds it, and toolchain
# bootstrap --external chooses it by name and builds a small package with it;
# a GCC the image lacks is refused. It needs no token.
e2e:external-compiler:
  stage: test
  image: docker.io/library/$IMAGE
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(schedule|web)$/'
  parallel:
    matrix:
      # GCC 16 next to the default GCC 15, so the version has to choose.
      - IMAGE: "ubuntu:26.04"
        GCC: "16"
        SEANERSTACK_E2E_EXTERNAL_COMPILER: "gcc@16"
        SEANERSTACK_E2E_MISSING_COMPILER: "gcc@14"
      # The newest GCC that Ubuntu 24.04 packages.
      - IMAGE: "ubuntu:24.04"
        GCC: "14"
        SEANERSTACK_E2E_EXTERNAL_COMPILER: "gcc@14"
        SEANERSTACK_E2E_MISSING_COMPILER: "gcc@15"
  variables:
    SEANERSTACK_E2E_REQUIRED: "1"
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      bzip2 ca-certificates file git libc6-dev make patch unzip xz-utils python3 python3-venv
      "gcc-$GCC" "g++-$GCC" "gfortran-$GCC"
    # uv, which run.sh uses, from PyPI into a virtual environment of its own.
    - python3 -m venv /opt/uv && /opt/uv/bin/pip install --quiet uv
    - export PATH="/opt/uv/bin:$PATH"
  script:
    - tests/e2e/run.sh tests/e2e/test_external_compiler.py

# The job token, for Git and the registry, in /tmp/secrets.toml as users write
# a secrets file, encrypted with /tmp/vault-password, which only has to
# outlive the job. Needs keyloom on PATH. GitLab flattens the nested list where
# a job's script names it.
.job-token-secrets: &job-token-secrets
  - umask 077
  - echo "$CI_JOB_ID" > /tmp/vault-password
  - |
    cat > /tmp/secrets.toml <<EOF
    [credentials.seanergys-gitlab]
    username = "gitlab-ci-token"
    token = { __keyloom__ = "secret", value = "$CI_JOB_TOKEN" }

    [credentials.seanergys-registry]
    username = "gitlab-ci-token"
    token = { __keyloom__ = "secret", value = "$CI_JOB_TOKEN" }
    EOF
  - keyloom encrypt /tmp/secrets.toml --password-file /tmp/vault-password

# Whether this pipeline can clone every private recipe, as build:rocky10 has
# to. The job token reads a project only if that project allows this one under
# Settings > CI/CD > Job token permissions, and only with the access of the
# user who started the pipeline, so a failure names the project to fix. Also in
# the schedule, which notices when a project withdraws the permission.
access:
  stage: test
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
    - uv sync
    - export PATH="$PWD/.venv/bin:$PATH"
    - *job-token-secrets
  script:
    - seanerstack --secrets-file /tmp/secrets.toml --secrets-password-file /tmp/vault-password validate --access

# seanergys-meta, built on Rocky Linux 10 the way a user's machine builds it:
# `seanerstack init` and `seanerstack toolchain bootstrap`, then an environment
# with that one package, which depends on every recipe that builds with the
# project toolchain. A recipe that does not build yet stays out of
# seanergys-meta, and joins it once it does. What the project build cache holds
# is installed from it, so a pipeline builds only what a change touches. The
# default branch pushes what it built, and rebuilds the index, for the
# pipelines after it; merge requests only read, so that no unreviewed recipe
# reaches the shared cache. Pushes of two pipelines at once are safe, and an
# index that misses the other's binaries is complete again after the next
# rebuild, which also leaves out binaries the pinned Spack cannot read.
build:rocky10:
  stage: build
  tags:
    - docker
    - seanerstack
  image: docker.io/rockylinux/rockylinux:10
  # The first pipeline after a toolchain change builds everything.
  timeout: 12h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  variables:
    PLATFORM: rocky10
    ENVIRONMENT: /opt/seanergys-meta
  before_script:
    - dnf install -y --setopt=install_weak_deps=False python3 python3-pip
    - python3 -m venv /opt/seanerstack
    - /opt/seanerstack/bin/pip install --quiet .
    - export PATH="/opt/seanerstack/bin:$PATH"
    - >-
      eval "$(python -c 'import sys, seanerstack.config, seanerstack.prepare;
      print(seanerstack.prepare.install_command(seanerstack.config.load_config().toolchain.platform(sys.argv[1])))'
      "$PLATFORM")"
    - *job-token-secrets
  script:
    # The default branch repairs an index that init cannot read, such as one a
    # newer Spack wrote; merge requests only report it.
    - |
      if ! seanerstack --secrets-file /tmp/secrets.toml --secrets-password-file /tmp/vault-password init; then
        [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || exit 1
        seanerstack buildcache update-index
        seanerstack init
      fi
    - export PATH="/opt/seanergys/state/spack/bin:$PATH"
    - seanerstack toolchain bootstrap
    # Spack clones the private recipes with Git itself.
    - >-
      git config --global
      url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.seanergys.fz-juelich.de/".insteadOf
      "https://gitlab.seanergys.fz-juelich.de/"
    - spack env create --without-view -d "$ENVIRONMENT"
    - spack -e "$ENVIRONMENT" add seanergys-meta
    - spack -e "$ENVIRONMENT" concretize
    # Push what was built even when another package failed.
    - status=0; spack -e "$ENVIRONMENT" install || status=$?
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        spack buildcache push --only package seanerstack-buildcache $(spack find --format '/{hash}')
        seanerstack buildcache update-index
      fi
    - exit "$status"

docs:
  stage: docs
  # A strict build fails on broken links before a merge; on the default branch,
  # it is what `pages` publishes.
  rules:
    - if: '$CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE =~ /^(merge_request_event|push|web)$/'
  script:
    - uv sync --group docs
    - uv run properdocs build --strict
  artifacts:
    paths:
      - site/

pages:
  stage: publish
  needs:
    - job: docs
      artifacts: true
  script:
    - mv site public
  pages:
    publish: public
  # Only where `docs` runs, which a schedule does not.
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(push|web)$/'

publish:
  stage: publish
  environment:
    name: gitlab-pypi
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: never
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "Publishing seanerstack ${VERSION} to GitLab PyPI"
    - PACKAGE_VERSION="$(uv version --short --frozen)"
    - >-
      if [ "${VERSION}" != "${PACKAGE_VERSION}" ]; then
      echo "Tag ${CI_COMMIT_TAG} does not match version ${PACKAGE_VERSION} in pyproject.toml";
      exit 1;
      fi
    - uv build --no-sources
    - >-
      uv publish
      --publish-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
      --username gitlab-ci-token
      --password "${CI_JOB_TOKEN}"

# Living at head: every push to the default branch publishes a development
# build, <next patch>.dev<pipeline number>, for example 0.1.4.dev57. Consumers
# that ask for development builds get the newest one; tagged releases stay the
# stable versions and sort after the development builds before them.
publish:dev:
  stage: publish
  environment:
    name: gitlab-pypi
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
  script:
    - uv version --frozen --bump patch --bump "dev=${CI_PIPELINE_IID}"
    - echo "Publishing seanerstack $(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])') to GitLab PyPI"
    - uv build --no-sources
    - >-
      uv publish
      --publish-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
      --username gitlab-ci-token
      --password "${CI_JOB_TOKEN}"

# Every night, the toolchain of [toolchain] in data/share/seanerstack/config.toml
# for each of its platforms: `seanerstack buildcache prepare` builds what the
# project build cache lacks and pushes it. A night in which nothing changed
# only checks that the cache holds everything.
#
# It runs in a pipeline schedule of the default branch (Build > Pipeline
# schedules), or by hand from Build > Pipelines > Run pipeline. The job token
# may push to the container registry of this project, which holds the cache.
#
# Each job runs in the image of its platform, the same image as in config.toml
# (a unit test keeps them equal), and builds there with --no-container, so no
# Docker daemon is needed. The steps are those prepare runs in a container.
toolchain:
  stage: toolchain
  tags:
    - docker
    - seanerstack
  image: $IMAGE
  # Building GCC and Rust from nothing takes hours; later nights reuse them.
  timeout: 12h
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  parallel:
    matrix:
      - PLATFORM: rocky10
        IMAGE: docker.io/rockylinux/rockylinux:10
      # Seanerstack needs Python 3.12, and the python3 of Rocky 9 is 3.9.
      - PLATFORM: rocky9
        IMAGE: docker.io/rockylinux/rockylinux:9
        PYTHON: python3.12
      - PLATFORM: fedora45
        IMAGE: docker.io/library/fedora:45
      - PLATFORM: fedora44
        IMAGE: docker.io/library/fedora:44
      - PLATFORM: debian13
        IMAGE: docker.io/library/debian:13
      - PLATFORM: debian14
        IMAGE: docker.io/library/debian:forky
      - PLATFORM: ubuntu26.04
        IMAGE: docker.io/library/ubuntu:26.04
      - PLATFORM: ubuntu24.04
        IMAGE: docker.io/library/ubuntu:24.04
      - PLATFORM: arch
        IMAGE: docker.io/library/archlinux:latest
  variables:
    SEANERSTACK_RESOURCE_SEANERSTACK_BUILDCACHE_USERNAME: "gitlab-ci-token"
    SEANERSTACK_RESOURCE_SEANERSTACK_BUILDCACHE_PASSWORD: "$CI_JOB_TOKEN"
    # Where seanerctl builds and the services install. Spack cannot relocate a
    # binary to a longer path, so the cache is built here, as in the container.
    STATE: /opt/seanergys/state
  before_script:
    # Just enough Python for Seanerstack, which then installs the system
    # packages of the platform from config.toml.
    - PYTHON="${PYTHON:-python3}"
    - |
      if command -v dnf >/dev/null; then
        dnf install -y --setopt=install_weak_deps=False "$PYTHON" "$PYTHON-pip"
      elif command -v apt-get >/dev/null; then
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 python3-venv python3-pip
      else
        pacman -Syu --noconfirm --needed python python-pip
      fi
    - '"$PYTHON" -m venv /opt/seanerstack'
    - /opt/seanerstack/bin/pip install --quiet .
    - >-
      eval "$(/opt/seanerstack/bin/python -c 'import sys, seanerstack.config, seanerstack.prepare;
      print(seanerstack.prepare.install_command(seanerstack.config.load_config().toolchain.platform(sys.argv[1])))'
      "$PLATFORM")"
    # Spack names the operating system after /etc/os-release. An installed
    # system links it to /usr/lib/os-release, but the archlinux image writes
    # its own with the date of the image as version, which no machine has.
    - if [ -e /usr/lib/os-release ]; then ln -sf ../usr/lib/os-release /etc/os-release; fi
  script:
    # Explain what was built even when a package failed.
    - >-
      status=0;
      /opt/seanerstack/bin/seanerstack --state-dir "$STATE"
      buildcache prepare --no-container --platform "$PLATFORM" || status=$?
    # Why a night built instead of reusing: each spec of the toolchain against
    # the cached specs of its name and version, which include the other
    # platforms and earlier nights. It runs after prepare, which sets the
    # target and the compiler that the specs concretize with, and never fails
    # the job.
    - >-
      SPECS="$(/opt/seanerstack/bin/python -c 'import seanerstack.config;
      toolchain = seanerstack.config.load_config().toolchain;
      print(toolchain.compiler, *toolchain.packages)')"
    - |
      for spec in $SPECS; do
        echo "== seanerstack buildcache explain $spec"
        /opt/seanerstack/bin/seanerstack --state-dir "$STATE" buildcache explain "$spec" || true
      done
    - exit "$status"
