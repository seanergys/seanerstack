# SPDX-License-Identifier: Apache-2.0
image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

stages:
  - test
  - docs
  - publish

test:
  stage: test
  script:
    - uv sync --group dev
    - uv run pytest
    - uv run seanerstack validate

# Builds the wheel of this commit, installs it into a fresh environment, and
# runs tests/e2e against this GitLab instance. The job token reads the demobus
# repository, and builds and pushes a small package into
# test-e2e-buildcache-<test> in the project's container registry, separate
# from the project build cache, before installing it back from there.
e2e:
  stage: test
  variables:
    SEANERSTACK_E2E_REQUIRED: "1"
    SEANERSTACK_E2E_USERNAME: "gitlab-ci-token"
    SEANERSTACK_E2E_TOKEN: "$CI_JOB_TOKEN"
    SEANERSTACK_E2E_SPACK: "/opt/spack/bin/spack"
    SEANERSTACK_E2E_REGISTRY: "oci://$CI_REGISTRY_IMAGE"
    SPACK_VERSION: "v1.2.2"
  before_script:
    - apt-get update
    # Git for Spack and the tests; a compiler, make and archivers for Spack to
    # build the test package.
    - >-
      apt-get install -y --no-install-recommends
      bzip2 ca-certificates file g++ gcc git libc6-dev make patch unzip xz-utils
    - git clone --depth 1 --branch "$SPACK_VERSION" https://github.com/spack/spack.git /opt/spack
  script:
    - tests/e2e/run.sh

docs:
  stage: docs
  script:
    - uv sync --group docs
    - uv run properdocs build --strict
  artifacts:
    paths:
      - site/

pages:
  stage: publish
  needs:
    - job: docs
      artifacts: true
  script:
    - mv site public
  pages:
    publish: public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

publish:
  stage: publish
  environment:
    name: gitlab-pypi
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: never
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "Publishing seanerstack ${VERSION} to GitLab PyPI"
    - PACKAGE_VERSION="$(uv version --short --frozen)"
    - >-
      if [ "${VERSION}" != "${PACKAGE_VERSION}" ]; then
      echo "Tag ${CI_COMMIT_TAG} does not match version ${PACKAGE_VERSION} in pyproject.toml";
      exit 1;
      fi
    - uv build --no-sources
    - >-
      uv publish
      --publish-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
      --username gitlab-ci-token
      --password "${CI_JOB_TOKEN}"
