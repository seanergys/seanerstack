# SPDX-License-Identifier: Apache-2.0
image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

stages:
  - test
  - docs
  - publish

test:
  stage: test
  script:
    - uv sync --group dev
    - uv run pytest
    - uv run seanstack validate

docs:
  stage: docs
  script:
    - uv sync --group docs
    - uv run properdocs build --strict
  artifacts:
    paths:
      - site/

publish:
  stage: publish
  environment:
    name: gitlab-pypi
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: never
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "Publishing seanstack ${VERSION} to GitLab PyPI"
    - uv version "${VERSION}" --frozen
    - uv build --no-sources
    - >-
      uv publish
      --publish-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
      --username gitlab-ci-token
      --password "${CI_JOB_TOKEN}"
