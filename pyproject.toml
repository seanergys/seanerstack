# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "seanerstack"
dynamic = ["version"]
description = "Curated Spack recipes and environments for SEANERGYS, with synchronization, bootstrap, and validation tooling."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "packaging>=24",
  "PyYAML>=6",
  "keyloom>=0.1.0",
]

[project.scripts]
seanerstack = "seanerstack.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
]
docs = [
  "properdocs>=1.6.7",
  "mkdocs-materialx",
  "mkdocs-awesome-nav",
  "mkdocs-gen-files",
  "pymdown-extensions",
]

# The version is defined once, in src/seanerstack/__init__.py.
[tool.hatch.version]
path = "src/seanerstack/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/seanerstack"]

# Install the curated Spack repository and environments outside site-packages.
# The contents of data/ are installed relative to the Python environment prefix,
# yielding <prefix>/share/seanerstack/...
[tool.hatch.build.targets.wheel.shared-data]
"data/share" = "share"

[tool.pytest.ini_options]
# tests/e2e runs only through tests/e2e/run.sh, against the installed wheel.
testpaths = ["tests/unit"]
addopts = "-ra"
