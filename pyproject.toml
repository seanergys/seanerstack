# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[project]
name = "seanerstack"
version = "0.1.8"
description = "Curated Spack recipes and environments for SEANERGYS, with synchronization, bootstrap, and validation tooling."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "packaging>=24",
  "PyYAML>=6",
  "keyloom>=0.4.1",
]

# Spack reads and writes S3 build caches with boto3, which it imports from
# the Python it runs on: `pip install "seanerstack[s3]"` puts it next to
# Seanerstack, for a Spack that runs on that Python.
[project.optional-dependencies]
s3 = [
  "boto3>=1.26",
]

[project.scripts]
seanerstack = "seanerstack.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
]
docs = [
  "properdocs>=1.6.7",
  "mkdocs-materialx",
  "mkdocs-awesome-nav",
  "mkdocs-gen-files",
  "pymdown-extensions",
]

# Install the curated Spack repository and environments outside site-packages.
# The contents of data/ are installed relative to the Python environment prefix,
# yielding <prefix>/share/seanerstack/...
[tool.uv.build-backend]
data = { data = "data" }

[tool.pytest.ini_options]
# tests/e2e runs only through tests/e2e/run.sh, against the installed wheel.
testpaths = ["tests/unit"]
addopts = "-ra"
