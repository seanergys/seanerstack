# The config.toml of the public job of .github/workflows/install.yml, which
# installs the stack with nothing that needs an account: the public build
# caches on the Juphoria object storage of FZJ, read without keys over Swift,
# and no Git resource, so no private repository is asked for anything.
#
# The caches have the names of the registry caches of the shipped config.toml,
# whose [toolchain] it takes, so the toolchain points at them. The
# toolchain:public jobs of the GitLab pipeline fill them, from
# ci/public-buildcache.toml, which writes the same buckets over S3.

[resources.seanerstack-buildcache]
kind = "spack-buildcache"
url = "https://juphoria-s3.fz-juelich.de/swift/v1/AUTH_e6da86ecdd8c44b5848998a4393d217e/seanergys-seanerstack-buildcache"
signed = false

[resources.seanerstack-buildcache-bootstrap]
kind = "spack-buildcache"
url = "https://juphoria-s3.fz-juelich.de/swift/v1/AUTH_e6da86ecdd8c44b5848998a4393d217e/seanergys-seanerstack-buildcache-bootstrap"
signed = false
