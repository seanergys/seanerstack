# SPDX-License-Identifier: Apache-2.0
site_name: Seanerstack
site_description: "Curated Spack stack and maintenance tooling for SEANERGYS"

# The repository, linked from the header of every page, and the editor of
# the page behind its pencil, so that a reader can open an issue or fix
# a page where they read it.
repo_url: https://gitlab.seanergys.fz-juelich.de/software/seanerstack
repo_name: software/seanerstack
edit_uri: -/edit/main/docs/
copyright: "SEANERGYS"
docs_dir: docs

# Theme and visual identity are inherited from Seanerdocs.
theme:
  name: materialx
  icon:
    logo: custom/seanergys
  favicon: custom/seanergys-colour
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  custom_dir: docs/overrides
  topbar_style: primary
  palette:
    - media: "(prefers-color-scheme)"
      primary: teal
      accent: cyan
      toggle:
        icon: custom/toggle-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: custom/toggle-light
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: custom/toggle-dark
        name: Switch to system preference

plugins:
  - gen-files:
      scripts:
        - docs/gen_reference.py
  - awesome-nav
  - search

extra:
  social:
    - icon: material/web
      link: https://seanergys.eu
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.seanergys.fz-juelich.de/
  generator: false

extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      options:
        custom_icons:
          - docs/overrides/.icons
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  # The how-to guides show sections of the scripts that test them.
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
